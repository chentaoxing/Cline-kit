name: release

on:
  push:
    tags:
      - "v*"
  # so a maintainer can re-run the packaging without moving a tag
  workflow_dispatch:
    inputs:
      version:
        description: "Version to name the artifact (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test the CLI
        run: |
          node scripts/selftest.js
          node --check src/cli.js
          node --check src/engine.js
          node src/cli.js status
          node -e "const d=require('./dictionaries/zh-CN.json'); if(!d.entries||Object.keys(d.entries).length<100) throw new Error('dictionary looks truncated')"

      - name: Build a portable zip (no install required for end users)
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.version || github.ref_name }}"
          $out = "cline-kit-$ref-win"
          New-Item -ItemType Directory -Path "$out/src", "$out/dictionaries" -Force | Out-Null
          Copy-Item -Recurse -Force src/* "$out/src"
          Copy-Item -Recurse -Force dictionaries/* "$out/dictionaries"
          Copy-Item -Force package.json, ckit.cmd, README.md, README.zh-CN.md, LICENSE, NOTICE, SECURITY.md, CHANGELOG.md $out
          # Compress-Archive writes backslash entry names on Windows, which extract as one oddly
          # named file outside Explorer; ship through our own writer instead.
          node scripts/make-zip.js $out "$out.zip"

      # Only a tag push can create a release; a manual dispatch just validates the build.
      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cline-kit-*.zip
          generate_release_notes: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC to npm; no NPM_TOKEN secret exists in this repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 + npm 12: npm's trusted publishing needs the CLI to know about OIDC at all
          # (npm >= 11.5.1); an older npm silently falls back to "please run npm adduser".
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Release builds must not resolve a stale cached dependency tree.
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@12
          npm --version

      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` even when no token is configured, and npm
      # then authenticates with that placeholder instead of OIDC (registry answers 404). Replace the
      # generated userconfig with one that carries no auth line so npm uses the runner's ID token.
      - name: Use a token-free npm config so publishing goes through OIDC
        run: |
          printf 'registry=https://registry.npmjs.org/\nprovenance=true\n' > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      # npm takes the OIDC identity from the runner because this package has a trusted publisher
      # registered for chentaoxing / Cline-kit / release.yml. No credential exists in this repo.
      - name: Publish to npm via OIDC trusted publishing
        run: npm publish --provenance --access public
